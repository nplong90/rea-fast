name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build MCP executable for black-box protocol checks
        run: cargo build --locked
      - name: MCP malformed-input recovery smoke
        shell: bash
        run: |
          extension=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then extension=".exe"; fi
          node tests/security/mcp-stdio.mjs --rust-bin "target/debug/rea-fast${extension}"
      - name: MCP oversize streaming and recovery (Linux)
        if: runner.os == 'Linux'
        run: node tests/security/mcp-stdio.mjs --rust-bin target/debug/rea-fast --oversize
      - name: Build release candidate
        run: cargo build --locked --release
      - name: Validate and stage release candidate
        run: node tests/release/stage.mjs
      - name: Upload commit-pinned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: rea-fast-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist-ci/
          retention-days: 7
          if-no-files-found: error
